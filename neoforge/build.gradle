plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

tasks.jarJar {
    enabled = true
}

def protocolVersion = protocols_use_local_build == "true" ? protocols_local_version : protocols_version

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    dependencies {
        implementation(jarJar(files("../libs/fabric-api-base-${fabric_base}.jar")))
        implementation(jarJar(files("../libs/fabric-networking-api-v1-${fabric_networking}.jar")))
        implementation("me.shedaniel.cloth:cloth-config-neoforge:${clothconfig_version}")

        implementation(jarJar("com.github.NiFeather:feathermorph-protocols:${protocolVersion}"))
        additionalRuntimeClasspath("com.github.NiFeather:feathermorph-protocols:${protocolVersion}")
        implementation(jarJar("com.github.NiFeather:feathermorph-command-compat-layer:${compat_layer_version}"))
        additionalRuntimeClasspath("com.github.NiFeather:feathermorph-command-compat-layer:${compat_layer_version}")
    }
    //parchment {
    //    minecraftVersion = parchment_minecraft
    //    mappingsVersion = parchment_version
    //}
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            clientData()
            serverData()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }