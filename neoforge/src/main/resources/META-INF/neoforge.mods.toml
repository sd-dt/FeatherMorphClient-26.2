modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL="https://github.com/MATRIX-feather/FeatherMorphClient/issues" #optional

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
updateJSONURL = "https://api.modrinth.com/updates/feathermorphclient/forge_updates.json"
displayURL = "https://modrinth.com/mod/feathermorphclient"
logoFile="assets/morphclient/icon.png"
credits="${credits}"
authors = "${mod_author}"
description = '''${description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}_guifix.mixins.json"

[[mixins]]
config = "${mod_id}_pipfix.mixins.json"

[[mixins]]
config = "${mod_id}.nf.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "cloth_config"
type = "required"
versionRange = "[${clothconfig_version},)"
ordering = "AFTER"
side = "CLIENT"